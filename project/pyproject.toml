[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "space-weather-launch-risk"
version = "1.0.0"
description = "A modular space weather launch-risk analysis project"
requires-python = ">=3.10"
dependencies = [
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "scikit-learn",
  "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
space-weather = "space_weather.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
